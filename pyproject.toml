[project]
name = "pda-mbads"
version = "0.1.0"
description = "Programming for Data Analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.3",
    "numpy>=2.4.0",
    "plotly>=6.5.0",
    "scikit-learn>=1.8.0",
    "python-dotenv>=1.2.1",
    "yfinance",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.1.1",
    "ipykernel>=7.1.0",
    "notebook>=7.5.1",
]

[tool.uv]
dev-dependencies = [
    "jupyter>=1.1.1",
    "ipykernel>=7.1.0",
    "notebook>=7.5.1",
]
